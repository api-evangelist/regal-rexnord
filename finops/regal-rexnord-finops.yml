meters:
  - name: contract_term
    unit: month
    aggregation: sum
principles:
  - name: Visibility
    description: Visibility comes from the Regal Rexnord PO / service-contract invoice; there is no programmatic
      usage feed.
  - name: Allocation
    description: Allocate to the plant, business unit, or product line consuming the motors / drives /
      services covered by the contract.
  - name: Optimization
    description: Optimization happens in procurement — consolidate suppliers, negotiate volume, and
      align spec with application need at PO time.
  - name: Accountability
    description: Owner is the procurement / engineering function that signed the Regal Rexnord agreement.
notes: Industrial-product spend rather than API usage. Generic per-request meters and FOCUS columns
  removed.
